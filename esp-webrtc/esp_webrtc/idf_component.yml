## IDF Component Manager Manifest File
description: Espressif WebRTC Library
version: 0.9.1

dependencies:
  espressif/nghttp: "~1.65.0"
  espressif/esp_websocket_client: "~1.4.0"
  espressif/esp_codec_dev: "~1.5"
  espressif/esp_capture: "~1.0"
  espressif/esp_peer:
    override_path: ../esp_peer
  tempotian/media_lib_utils:
    require: public
    version: "~0.9"
    override_path: ../media_lib_utils
  tempotian/av_render:
    require: public
    # Vendored locally (sibling dir), like esp_peer / media_lib_utils above.
    # override_path uses the in-repo 1.0.0 and drops the registry ~0.9 pin, which
    # the vendored copy no longer satisfies — avoids a version-solve conflict when
    # a stricter component-manager re-resolves the graph.
    override_path: ../av_render
